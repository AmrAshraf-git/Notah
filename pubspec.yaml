name: Notah

description: "A workspace app for freelancers to help them manage their businesses"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/
    - assets/svgs/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope_variable-font_wght.ttf