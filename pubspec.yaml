name: Notah

description: "A workspace app for freelancers to help them manage their businesses"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  cached_network_image: ^4.0.2
  flutter_svg: ^2.3.0
  pinput: ^6.0.2
  toastification: ^3.2.0
  iconsax: ^0.0.8
  logger: ^2.7.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/
    - assets/svgs/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope_variable-font_wght.ttf